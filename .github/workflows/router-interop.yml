name: Router interop

# The guidance gateway against the real asset-router at one exact commit (RM47, AC42;
# spec 0.72 section 7.7): scripts/asset_router_interop.py clones that commit, installs its
# locked dependencies and runs tests/test_guidance_router_interop.py. Inference is a
# deterministic double, so a pass says the two programs interoperate, never how well a real
# model ranks.
#
# asset-router is private. A GitHub App installed only on asset-router, with read access to
# its contents, gives this job a token that lasts one hour; the app's ID and private key are
# the ROUTER_APP_ID and ROUTER_APP_PRIVATE_KEY secrets. The token is used only to fetch the
# exact router commit and is never written to disk or passed on, so neither the router's
# npm ci nor the tests see it. Without the secrets (a fork, or before they are set up)
# nothing can be checked, so the job fails and says why: an unavailable check is never green.
# The runner also fails a run in which any interop test skipped or none ran, and writes a
# result naming both commits, attached to the run.

on:
  pull_request:
    paths:
      - .github/workflows/router-interop.yml
      - src/relaymind/guidance/**
      - src/relaymind/selection/asset_http.py
      - src/relaymind/selection/asset_contract.py
      - tests/router_interop.py
      - tests/test_guidance_router_interop.py
      - scripts/asset_router_interop.py
  push:
    branches: [master]
    paths:
      - .github/workflows/router-interop.yml
      - src/relaymind/guidance/**
      - src/relaymind/selection/asset_http.py
      - src/relaymind/selection/asset_contract.py
      - tests/router_interop.py
      - tests/test_guidance_router_interop.py
      - scripts/asset_router_interop.py
  workflow_dispatch:
    inputs:
      rev:
        description: Exact 40-hex asset-router commit (empty for the pinned one)
        required: false

permissions:
  contents: read

concurrency:
  group: router-interop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The asset-router commit this RelayMind revision is checked against. Move it only to a
  # commit that passed here; the runner refuses anything but a full commit.
  ROUTER_REV: 621b879b2ee8a233d9c5ff2cdfd31931b83b0226

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: App credentials
        id: key
        env:
          APP_ID: ${{ secrets.ROUTER_APP_ID }}
          APP_KEY: ${{ secrets.ROUTER_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            message="ROUTER_APP_ID or ROUTER_APP_PRIVATE_KEY is not set: asset-router interop was NOT validated for this commit."
            echo "::error::$message"
            {
              echo "## Router interop: not validated"
              echo
              echo "$message No interop test ran. See docs/TESTING.md to set up the GitHub App."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v1
        id: token
        if: steps.key.outputs.present == 'true'
        with:
          app-id: ${{ secrets.ROUTER_APP_ID }}
          private-key: ${{ secrets.ROUTER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: asset-router

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - name: Fetch the router commit
        if: steps.key.outputs.present == 'true'
        env:
          REV: ${{ inputs.rev || env.ROUTER_REV }}
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          case "$REV" in
            *[!0-9a-f]* | "") echo "::error::not a full commit: $REV"; exit 2 ;;
          esac
          [ ${#REV} -eq 40 ] || { echo "::error::not a full commit: $REV"; exit 2; }
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          # Where the runner looks for this commit; it then needs no access of its own.
          dir="$RUNNER_TEMP/relaymind-interop/asset-router-$REV"
          git init -q "$dir"
          git -C "$dir" remote add origin "https://github.com/${{ github.repository_owner }}/asset-router.git"
          git -C "$dir" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" \
            fetch -q --depth 1 origin "$REV"

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: '24.22.1'

      - name: Install
        if: steps.key.outputs.present == 'true'
        run: pip install -e ".[dev]"

      - name: Interop at the router commit
        if: steps.key.outputs.present == 'true'
        env:
          REV: ${{ inputs.rev || env.ROUTER_REV }}
        run: |
          python scripts/asset_router_interop.py --rev "$REV" \
            --cache "$RUNNER_TEMP/relaymind-interop" \
            --result ci-evidence/router-interop.json

      - name: Summary
        if: always() && steps.key.outputs.present == 'true'
        run: |
          {
            echo "## Router interop"
            echo
            echo '```json'
            cat ci-evidence/router-interop.json 2>/dev/null || echo '{"outcome": "not_validated"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: router-interop
          path: ci-evidence/router-interop.json
          if-no-files-found: warn
          retention-days: 30
